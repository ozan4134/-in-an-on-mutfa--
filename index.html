<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Asian Kitchen's Menu</title>
    <!-- Google Fonts: Great Vibes (Başlık için) -->
    <link
      href="https://fonts.googleapis.com/css2?family=Great+Vibes&display=swap"
      rel="stylesheet"
    />
    <!-- Bootstrap CSS (Izgara ve temel stiller için) -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0-beta1/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-giJF6kkoqNQ00vy+HMDP7azOuL0xtbfIcaT9wjKHr8RbDVddVHyTfAAsrekwKmP1"
      crossorigin="anonymous"
    />
    <!-- Kendi yazdığımız CSS dosyamız -->
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <section class="menu">
        <!-- Başlık Kısmı -->
        <div class="title">
          <h2>Asian Kitchen's Menu</h2>
        </div>
        <!-- Filtreleme Butonlarının Geleceği Alan (JavaScript ile doldurulacak) -->
        <div class="btn-container"></div>
        
        <!-- Menü Elemanlarının Geleceği Alan (JavaScript ile doldurulacak) -->
        <div class="section-center row"></div>
      </section>
    </div>
    
    <!-- Kendi yazdığımız JavaScript dosyamız -->
    <script src="app.js"></script>
  </body>
</html>
